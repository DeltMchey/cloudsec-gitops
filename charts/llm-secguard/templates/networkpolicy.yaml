{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "llm-secguard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-secguard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "llm-secguard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # CoreDNS in kube-system, over both DNS transports.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes NetworkPolicy cannot filter egress by DNS name. TCP/443 is
    # therefore an IP/port allow rule, NOT a claim that only DeepSeek is allowed.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Existing Redis/PostgreSQL Docker services on the W3 VM private address.
    - to:
        - ipBlock:
            cidr: 192.168.137.10/32
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
{{- end }}
